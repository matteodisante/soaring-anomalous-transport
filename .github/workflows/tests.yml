name: Tests

# Runs the test suite on every push to main and every PR. `dev` and `analysis` are
# uv default dependency groups; include the opt-in `satellite` group so its tests
# run in CI too.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run tests with coverage
        run: uv run --group satellite pytest --cov=soaring --cov-report=xml

      # Coverage upload is best-effort: a Codecov hiccup (or the repo not being linked
      # there yet) must never fail the test job / redden the Tests badge.
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false
