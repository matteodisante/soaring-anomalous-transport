# Satellite cloud imagery cropped to the Thermal-planes cells.
# Schema and defaults: see src/soaring/acquisition/satellite/config.py
# Run: uv run --group satellite python scripts/pipeline/download_satellite.py --help

# Only the cropped windows are written here; downloaded files never touch the disk.
output_root: /Volumes/SSD_DISANTE/paragliders/ffvl_cfd_igc/derived/satellite

# Stop cleanly, before writing, when the output disk has less than this free.
min_free_gib: 10

# Keep images taken between these local hours: start inclusive, end exclusive.
local_timezone: Europe/Paris
local_hours: [8, 20]

# Window around each cell centre, in Lambert-93 metres. 5000 gives the 10 x 10 km
# Zoom - view of Thermal planes. Clouds appear up to ~6 km north of their true
# position (parallax), so the window is extended north and slightly sideways.
window:
  half_size_m: 5000
  north_margin_m: 7000
  side_margin_m: 1000

# The twelve Thermal-planes cells, frozen from thermal-planes.sqlite3 (ranking
# vilpellet-climb-runs-dem-top-v1) on 2026-10-06. Cell (ix, iy) is the Lambert-93
# square [ix, ix + 1) x [iy, iy + 1) times cell_size_m. Freezing them keeps the
# dataset consistent if the viewer ranking changes.
cell_size_m: 5000
cells:
  - {ix: 89, iy: 1375, terrain: Plains}
  - {ix: 89, iy: 1374, terrain: Plains}
  - {ix: 114, iy: 1275, terrain: Plains}
  - {ix: 184, iy: 1293, terrain: Hills}
  - {ix: 185, iy: 1294, terrain: Hills}
  - {ix: 189, iy: 1305, terrain: Hills}
  - {ix: 190, iy: 1306, terrain: Low mountains}
  - {ix: 195, iy: 1265, terrain: Low mountains}
  - {ix: 184, iy: 1294, terrain: Low mountains}
  - {ix: 197, iy: 1309, terrain: High mountains}
  - {ix: 193, iy: 1309, terrain: High mountains}
  - {ix: 194, iy: 1308, terrain: High mountains}
