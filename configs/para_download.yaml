# FFVL CFD Parapente (paraglider) downloader configuration.
# Schema and defaults: see src/soaring/acquisition/ffvl/config.py
# Use the CLI entry point: soaring-para <subcommand>

# Root directory for raw data (~65 GB) -- keep it on the external disk.
# The environment variable always overrides this line:
#     export SOARING_PARA_DATA_ROOT=/Volumes/SSD_DISANTE/paragliders/ffvl_cfd_igc
# It is the way to set it on a machine whose disk is mounted elsewhere. This file carries
# a real path rather than a placeholder because the pre-commit hook runs
# refresh_seasons_index.py and generate_census_stats.py with no environment at all: with a
# placeholder here they resolve nothing, exit quietly, and the hook silently stops keeping
# the committed snapshots and census.tex up to date. Both configs carry a real path for
# that reason, and both are overridable.
data_root: /Volumes/SSD_DISANTE/paragliders/ffvl_cfd_igc

# Seasons to process. The year is the START year of the season:
#   1999 -> season 1999-2000   |   2025 -> season 2025-2026
seasons:
  start: 1999
  end: 2025

# Data source — paraglider CFD on parapente.ffvl.fr.
source:
  base_url: https://parapente.ffvl.fr
  list_path: /cfd/liste/{year}   # human-readable list page; {year} = season start year
  xml_query: "?xml=1"            # appended to the list URL -> full XML export

# Network settings and courtesy towards the FFVL server.
http:
  impersonate: chrome   # curl_cffi TLS fingerprint: bypasses the Cloudflare challenge
  workers: 4            # parallel downloads (conservative: do not hammer the server)
  timeout_s: 60         # per-request timeout
  max_retries: 5        # attempts per file before recording it as failed
  backoff_base_s: 2.0   # exponential backoff between attempts
  min_delay_s: 0.05     # minimum pause (with jitter) between requests from the same worker
